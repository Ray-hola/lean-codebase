name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (stdlib unittest, buffered)
        run: python -m unittest discover -s tests -t . -b -v

      - name: Smoke-run the scripts on this repo
        run: |
          python scripts/measure.py . --json before.json
          python scripts/find_duplicates.py . --show-diff
          printf 'measure_help\tpython scripts/measure.py --help\n' > probes.txt
          python scripts/snapshot.py record  --commands probes.txt --dir .refactor-baseline/snapshots
          python scripts/snapshot.py compare --commands probes.txt --dir .refactor-baseline/snapshots
